<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promise.all Example</title>
</head>
<body>
  <h2>Promise.all() Demo</h2>

  <button onclick="loadData()">Load Data</button>

  <div id="output"></div>

  <script>
    async function loadData() {
      const output = document.getElementById("output");
      output.innerHTML = "Loading...";

      try {

        const userAPI = fetch("https://jsonplaceholder.typicode.com/users/1").then(res => res.json());
        const postAPI = fetch("https://jsonplaceholder.typicode.com/posts/1").then(res => res.json());
        const commentAPI = fetch("https://jsonplaceholder.typicode.com/comments/1").then(res => res.json());

        const [user, post, comment] = await Promise.all([userAPI, postAPI, commentAPI]);

        console.log("User:", user.name);
        console.log("Post:", post.title);
        console.log("Comment:", comment.name);

        output.innerHTML = `
          <h3>All APIs Loaded Successfully</h3>
          <p><strong>User:</strong> ${user.name}</p>
          <p><strong>Post:</strong> ${post.title}</p>
          <p><strong>Comment:</strong> ${comment.name}</p>
        `;
      } catch (error) {
        console.error(error);
        output.innerHTML = `<h3 style="color:red">${error.message}</h3>`;
      }
    }
  </script>
</body>
</html>
