
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000; /* Black background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background:grey;
      display: flex;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      width: 900px;
      max-width: 95%;
    }

    /* Left side image */
    .left {
      flex: 1;
      background: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTC4DvpIn8W5He03chkdYpL8vm84YI0hGOk6LfnYp6CFNfmd0yOpFCJHYw&s=10") no-repeat center/cover;
    }

    /* Right side form */
    .right {
      flex: 1;
      padding: 40px;
    }

    h2 {
      margin-bottom: 10px;
      color: #333;
    }

    p {
      margin-bottom: 20px;
      font-size: 14px;
      color: #666;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    .grid {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .flex {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
      color:#eee
    }

    .flex input {
      margin-right: 8px;
    }

    .btn {
      background: #6c63ff;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #574bdb;
    }

    .social {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .social button {
      flex: 1;
      background: #eee;
      color: #333;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .social button:hover {
      background: #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left"></div>
    <div class="right">
      <h2 style="color:white;">Create an Account</h2>
      <form>
        <div class="grid">
          <input type="text" placeholder="First Name" required>
          <input type="text" placeholder="Last Name" required>
        </div>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Enter Your Password" required>
        <div class="flex">
          <input type="checkbox" id="terms" required>
          <label for="terms">I agree to the Terms & Conditions</label>
        </div>
        <button type="submit" class="btn">Create Account</button>
        <p style="margin-top:15px; color: white; text-align: center;">Or register with</p>
        <div class="social">
          <button class="google">Google</button>
          <button class="apple">Apple</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
